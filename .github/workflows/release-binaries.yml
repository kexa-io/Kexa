name: Build and Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
          cache: true
          cache-dependency-path: bun.lock

      - name: Install dependencies
        run: bun install

      - name: Update headers.service.ts with latest data
        run: |
          echo "Running Kexa to generate latest headers data..."
          timeout 60 bun run Kexa/main.ts || true
          echo "Headers service file updated with latest provider data"

      - name: Upload source for build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-with-headers
          path: |
            Kexa/
            node_modules/
            package.json
            bun.lock
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            output: kexa-linux-x64
            upx: true
          - target: bun-linux-arm64
            output: kexa-linux-arm64
            upx: true
          # macOS binaries are left uncompressed: UPX-packed Mach-O executables
          # are rejected by Gatekeeper / break code signing.
          - target: bun-darwin-x64
            output: kexa-macos-x64
            upx: false
          - target: bun-darwin-arm64
            output: kexa-macos-arm64
            upx: false
          # Windows left uncompressed: UPX-packed PE files are commonly flagged
          # by antivirus engines as false positives.
          - target: bun-windows-x64
            output: kexa-windows-x64.exe
            upx: false
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Download source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-with-headers

      - name: Build ${{ matrix.target }}
        run: |
          mkdir -p dist
          bun build ./Kexa/main.ts --compile --target=${{ matrix.target }} --outfile=dist/${{ matrix.output }} --minify

      - name: Compress binary with UPX
        if: matrix.upx
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q upx-ucl
          ls -la dist/${{ matrix.output }}
          upx --best --lzma dist/${{ matrix.output }}
          ls -la dist/${{ matrix.output }}

      - name: Set up QEMU (arm64 smoke test)
        if: matrix.target == 'bun-linux-arm64'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3

      - name: Smoke test compressed binary (x64)
        if: matrix.target == 'bun-linux-x64'
        run: |
          chmod +x dist/${{ matrix.output }}
          ./dist/${{ matrix.output }} --help

      - name: Smoke test compressed binary (arm64 via QEMU)
        if: matrix.target == 'bun-linux-arm64'
        run: |
          chmod +x dist/${{ matrix.output }}
          docker run --rm --platform linux/arm64 -v "$PWD/dist:/dist" frolvlad/alpine-glibc /dist/${{ matrix.output }} --help

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: kexa-*
          merge-multiple: true

      - name: Upload binaries to release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
